    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Fix for Chrome extensions attempting to overwrite window.fetch
      // Prevents "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _nativeFetch;
            },
            set: function(fn) {
              _nativeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if already defined
        }

        // Suppress external chrome-extension errors from polluting page execution
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
